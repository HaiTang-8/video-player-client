name: Build and Release

on:
  push:
    tags:
      - 'v*'
  # 手动触发只构建四个平台，不发布 Release，用于验证流水线
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        run: |
          # tag 触发用 tag 的版本，手动触发用 pubspec.yaml 的版本
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: 'stable'
      - name: Diagnose Windows toolchain
        shell: pwsh
        run: |
          flutter doctor -v
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
      # lockfile 在本地用镜像 pub.flutter-io.cn 生成；换回 pub.dev 后才会严格按 lockfile 安装（包内容和 sha256 一致）
      - name: Use pub.dev in lockfile
        shell: bash
        run: sed -i.bak 's#https://pub.flutter-io.cn#https://pub.dev#g' pubspec.lock && rm pubspec.lock.bak
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release --build-name=${{ needs.version.outputs.value }}
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Download Chinese language file for Inno Setup
        run: Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" -OutFile "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
      - name: Build EXE Installer
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.value }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$version windows\inno_setup.iss
      - name: Rename installer
        shell: pwsh
        run: |
          Move-Item -Path "dist\guanying-windows-setup.exe" -Destination "guanying-windows-${{ needs.version.outputs.value }}-setup.exe"
      - name: Create ZIP (backup)
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath guanying-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            guanying-windows-${{ needs.version.outputs.value }}-setup.exe
            guanying-windows.zip

  build-macos:
    needs: version
    runs-on: macos-26
    env:
      # AetherEngine 7.22.2 需要 Xcode 26.2+，目前只验证过 26.3（镜像默认是 26.6）
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: 'stable'
      # lockfile 在本地用镜像 pub.flutter-io.cn 生成；换回 pub.dev 后才会严格按 lockfile 安装（包内容和 sha256 一致）
      - name: Use pub.dev in lockfile
        shell: bash
        run: sed -i.bak 's#https://pub.flutter-io.cn#https://pub.dev#g' pubspec.lock && rm pubspec.lock.bak
      - run: flutter pub get --enforce-lockfile
      - run: flutter build macos --release --build-name=${{ needs.version.outputs.value }}
      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "观影" \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "观影.app" 150 200 \
            --app-drop-link 450 200 \
            --no-internet-enable \
            "guanying-macos-${{ needs.version.outputs.value }}.dmg" \
            "build/macos/Build/Products/Release/观影.app"
      - name: Sign DMG with Sparkle EdDSA
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          echo "$SPARKLE_PRIVATE_KEY" | macos/Pods/Sparkle/bin/sign_update "guanying-macos-${{ needs.version.outputs.value }}.dmg" -f - > sparkle_signature.txt
          cat sparkle_signature.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            guanying-macos-${{ needs.version.outputs.value }}.dmg
            sparkle_signature.txt

  build-android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK components
        run: |
          for attempt in 1 2 3; do
            if yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"; then
              exit 0
            fi
            rm -rf "$ANDROID_HOME/ndk/27.0.12077973"
            sleep 10
          done
          exit 1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache media-kit native libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2/files-2.1/com.github.nickoehler
            android/.gradle
          key: media-kit-android-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            media-kit-android-

      # lockfile 在本地用镜像 pub.flutter-io.cn 生成；换回 pub.dev 后才会严格按 lockfile 安装（包内容和 sha256 一致）
      - name: Use pub.dev in lockfile
        shell: bash
        run: sed -i.bak 's#https://pub.flutter-io.cn#https://pub.dev#g' pubspec.lock && rm pubspec.lock.bak
      - run: flutter pub get --enforce-lockfile

      - run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --build-name=${{ needs.version.outputs.value }}

      - name: Rename artifacts
        run: |
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk guanying-android-armeabi-v7a.apk
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk guanying-android-arm64-v8a.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            guanying-android-armeabi-v7a.apk
            guanying-android-arm64-v8a.apk

  build-ios:
    needs: version
    runs-on: macos-26
    env:
      # AetherEngine 7.22.2 需要 Xcode 26.2+，目前只验证过 26.3（镜像默认是 26.6）
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: 'stable'
      # lockfile 在本地用镜像 pub.flutter-io.cn 生成；换回 pub.dev 后才会严格按 lockfile 安装（包内容和 sha256 一致）
      - name: Use pub.dev in lockfile
        shell: bash
        run: sed -i.bak 's#https://pub.flutter-io.cn#https://pub.dev#g' pubspec.lock && rm pubspec.lock.bak
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --release --no-codesign --build-name=${{ needs.version.outputs.value }}
      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r media_player-ios.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: media_player-ios.ipa

  release:
    needs: [version, build-windows, build-macos, build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configuration: ".github/release-changelog-builder-config.json"
          commitMode: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate appcast.xml
        run: |
          VERSION="${{ needs.version.outputs.value }}"
          REPO="HaiTang-8/video-player-client"

          # Windows EXE info
          EXE_URL="https://github.com/${REPO}/releases/download/v${VERSION}/guanying-windows-${VERSION}-setup.exe"
          EXE_SIZE=$(stat -c%s "artifacts/guanying-windows-${VERSION}-setup.exe" 2>/dev/null || echo "0")

          # macOS DMG info
          DMG_URL="https://github.com/${REPO}/releases/download/v${VERSION}/guanying-macos-${VERSION}.dmg"
          DMG_SIZE=$(stat -c%s "artifacts/guanying-macos-${VERSION}.dmg" 2>/dev/null || echo "0")

          # Parse Sparkle EdDSA signature
          SPARKLE_SIG=$(cat artifacts/sparkle_signature.txt | grep -o 'sparkle:edSignature="[^"]*"' | sed 's/sparkle:edSignature="//;s/"//')
          DMG_LENGTH=$(cat artifacts/sparkle_signature.txt | grep -o 'length="[^"]*"' | sed 's/length="//;s/"//')
          if [ -n "$DMG_LENGTH" ]; then
            DMG_SIZE="$DMG_LENGTH"
          fi

          cat > artifacts/appcast.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>观影</title>
              <description>观影应用更新</description>
              <language>zh-CN</language>
              <item>
                <title>版本 ${VERSION}</title>
                <sparkle:version>${VERSION}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <pubDate>$(date -R)</pubDate>
                <enclosure
                  url="${DMG_URL}"
                  sparkle:version="${VERSION}"
                  sparkle:shortVersionString="${VERSION}"
                  sparkle:edSignature="${SPARKLE_SIG}"
                  length="${DMG_SIZE}"
                  type="application/x-apple-diskimage"
                  sparkle:os="macos"/>
              </item>
              <item>
                <title>版本 ${VERSION}</title>
                <sparkle:version>${VERSION}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <pubDate>$(date -R)</pubDate>
                <enclosure
                  url="${EXE_URL}"
                  sparkle:version="${VERSION}"
                  sparkle:os="windows"
                  length="${EXE_SIZE}"
                  type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          EOF
      - name: Generate checksums
        run: |
          cd artifacts
          for file in *.exe *.dmg *.apk *.ipa *.zip; do
            if [ -f "$file" ]; then
              sha256sum "$file" | awk '{print $1}' > "${file}.sha256"
            fi
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: ${{ steps.build_changelog.outputs.changelog }}
