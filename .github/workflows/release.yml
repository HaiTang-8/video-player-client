name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Archive
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath guanying-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: guanying-windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "观影" \
            --no-internet-enable \
            "media_player-macos.dmg" \
            "build/macos/Build/Products/Release/观影.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: media_player-macos.dmg

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'
      - run: flutter pub get
      # 说明：
      # 1) 默认 `flutter build apk --release` 会生成「通用 APK」（universal/fat），把多个 ABI（armv7/arm64/x86_64）的 so 一起打进去，体积会非常大。
      # 2) `--split-per-abi` 会按 ABI 拆分产物；再配合 `--target-platform` 只产出 armv7 + arm64，避免把 x86_64 一起打进发布包。
      - run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
      - name: Rename artifacts
        run: |
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk guanying-android-armeabi-v7a.apk
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk guanying-android-arm64-v8a.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            guanying-android-armeabi-v7a.apk
            guanying-android-arm64-v8a.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r media_player-ios.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: media_player-ios.ipa

  release:
    needs: [build-windows, build-macos, build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
