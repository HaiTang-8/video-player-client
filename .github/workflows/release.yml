name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'
      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - run: flutter pub get
      - run: flutter build windows --release --build-name=${{ steps.version.outputs.VERSION }}
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Download Chinese language file for Inno Setup
        run: Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl" -OutFile "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
      - name: Build EXE Installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$version windows\inno_setup.iss
      - name: Rename installer
        shell: pwsh
        run: |
          Move-Item -Path "dist\guanying-windows-setup.exe" -Destination "guanying-windows-${{ steps.version.outputs.VERSION }}-setup.exe"
      - name: Create ZIP (backup)
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath guanying-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            guanying-windows-${{ steps.version.outputs.VERSION }}-setup.exe
            guanying-windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - run: flutter pub get
      - run: flutter build macos --release --build-name=${{ steps.version.outputs.VERSION }}
      - name: Download Sparkle tools
        run: |
          curl -L "https://github.com/sparkle-project/Sparkle/releases/download/2.8.1/Sparkle-2.8.1.tar.xz" -o Sparkle.tar.xz
          tar -xf Sparkle.tar.xz
      - name: Create and Sign DMG
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          brew install create-dmg
          create-dmg \
            --volname "观影" \
            --no-internet-enable \
            "guanying-macos-${{ steps.version.outputs.VERSION }}.dmg" \
            "build/macos/Build/Products/Release/观影.app"

          if [ -n "$SPARKLE_PRIVATE_KEY" ]; then
            echo "$SPARKLE_PRIVATE_KEY" > /tmp/sparkle_private_key
            SIGNATURE=$(./bin/sign_update "guanying-macos-${{ steps.version.outputs.VERSION }}.dmg" -f /tmp/sparkle_private_key | grep -o 'sparkle:edSignature="[^"]*"' | cut -d'"' -f2)
            echo "SPARKLE_SIGNATURE=$SIGNATURE" >> $GITHUB_ENV
            rm /tmp/sparkle_private_key
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: guanying-macos-${{ steps.version.outputs.VERSION }}.dmg

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --build-name=${{ steps.version.outputs.VERSION }}
      - name: Rename artifacts
        run: |
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk guanying-android-armeabi-v7a.apk
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk guanying-android-arm64-v8a.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            guanying-android-armeabi-v7a.apk
            guanying-android-arm64-v8a.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --build-name=${{ steps.version.outputs.VERSION }}
      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r media_player-ios.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: media_player-ios.ipa

  release:
    needs: [build-windows, build-macos, build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configuration: ".github/release-changelog-builder-config.json"
          commitMode: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate appcast.xml
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          REPO="HaiTang-8/video-player-client"

          # Windows EXE info
          EXE_URL="https://github.com/${REPO}/releases/download/v${VERSION}/guanying-windows-${VERSION}-setup.exe"
          EXE_SIZE=$(stat -c%s "artifacts/guanying-windows-${VERSION}-setup.exe" 2>/dev/null || echo "0")

          # macOS DMG info
          DMG_URL="https://github.com/${REPO}/releases/download/v${VERSION}/guanying-macos-${VERSION}.dmg"
          DMG_SIZE=$(stat -c%s "artifacts/guanying-macos-${VERSION}.dmg" 2>/dev/null || echo "0")

          # Sign macOS DMG if key is available
          MACOS_SIGNATURE=""
          if [ -n "$SPARKLE_PRIVATE_KEY" ]; then
            curl -L "https://github.com/sparkle-project/Sparkle/releases/download/2.8.1/Sparkle-for-Swift-Package-Manager.zip" -o Sparkle.zip
            unzip -q Sparkle.zip
            echo "$SPARKLE_PRIVATE_KEY" > /tmp/sparkle_private_key
            MACOS_SIGNATURE=$(./bin/sign_update "artifacts/guanying-macos-${VERSION}.dmg" -f /tmp/sparkle_private_key 2>/dev/null | grep -o 'sparkle:edSignature="[^"]*"' | cut -d'"' -f2 || echo "")
            rm -f /tmp/sparkle_private_key
          fi

          cat > artifacts/appcast.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>观影</title>
              <description>观影应用更新</description>
              <language>zh-CN</language>
              <item>
                <title>版本 ${VERSION}</title>
                <sparkle:version>${VERSION}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <pubDate>$(date -R)</pubDate>
                <enclosure
                  url="${DMG_URL}"
                  sparkle:version="${VERSION}"
                  sparkle:shortVersionString="${VERSION}"
                  sparkle:edSignature="${MACOS_SIGNATURE}"
                  length="${DMG_SIZE}"
                  type="application/x-apple-diskimage"
                  sparkle:os="macos"/>
              </item>
              <item>
                <title>版本 ${VERSION}</title>
                <sparkle:version>${VERSION}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <pubDate>$(date -R)</pubDate>
                <enclosure
                  url="${EXE_URL}"
                  sparkle:version="${VERSION}"
                  sparkle:os="windows"
                  length="${EXE_SIZE}"
                  type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: ${{ steps.build_changelog.outputs.changelog }}
